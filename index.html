<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="出席管理">
<meta name="theme-color" content="#3b6fe0">
<title>出席管理</title>
<style>
:root{--bg:#f6f7f9;--fg:#1c2330;--mut:#6b7482;--card:#fff;--line:#dde1e8;--acc:#3b6fe0;--ok:#1f9d63;--ng:#d9475a;--late:#e08a1e;--early:#8a5cd6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--fg:#e8ebf0;--mut:#98a1b0;--card:#1d222b;--line:#2f3641;--acc:#6b96f2;--ok:#3ec98a;--ng:#f0687a;--late:#f0a540;--early:#a98af0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171d;--fg:#e8ebf0;--mut:#98a1b0;--card:#1d222b;--line:#2f3641;--acc:#6b96f2;--ok:#3ec98a;--ng:#f0687a;--late:#f0a540;--early:#a98af0;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;line-height:1.5}
main{max-width:780px;margin:0 auto;padding:16px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0 12px}
h1{font-size:20px;margin:0}
h2{font-size:15px;margin:0 0 10px}
.badge{font-size:12px;color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:2px 10px;background:var(--card);white-space:nowrap}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;font-size:15px;cursor:pointer}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.stabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.stabs button{flex:none;padding:8px 14px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:99px;font-size:14px;cursor:pointer;white-space:nowrap}
.stabs button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.stabs button.plus{color:var(--acc);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input,select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font-size:15px;min-width:0}
input[type=text]{flex:1 1 120px}
textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font-size:13px;font-family:ui-monospace,Menlo,monospace}
.btn{padding:9px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font-size:14px;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.del{color:var(--ng)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 6px 4px 10px;border:1px solid var(--line);border-radius:99px;font-size:14px}
.chip button{border:0;background:none;color:var(--mut);cursor:pointer;font-size:16px;line-height:1}
.mem{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.mem:first-of-type{border-top:0}
.mem .nm{flex:1 1 90px;font-weight:600;min-width:80px}
.mem small{color:var(--mut);font-weight:400}
.st{display:flex;gap:6px}
.st button{padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--mut);font-size:14px;cursor:pointer}
.st button.p.on{background:var(--ok);border-color:var(--ok);color:#fff}
.st button.a.on{background:var(--ng);border-color:var(--ng);color:#fff}
.st button.l.on{background:var(--late);border-color:var(--late);color:#fff}
.st button.e.on{background:var(--early);border-color:var(--early);color:#fff}
.st button.x.on{background:var(--mut);border-color:var(--mut);color:#fff}
.lamp{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:middle;border:1px solid rgba(0,0,0,.25)}
.lamp.g{background:var(--ok)}.lamp.y{background:#e8c21a}.lamp.r{background:var(--ng)}.lamp.k{background:#111;border-color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}
.stat{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card)}
.stat .lb{font-size:13px;color:var(--mut)}
.stat .v{font-size:28px;font-weight:700;margin:2px 0}
.stat .c{font-size:12px;color:var(--mut)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;font-weight:600}
th{color:var(--mut);font-weight:500;font-size:13px}
.note{font-size:12px;color:var(--mut);margin-top:8px}
.empty{color:var(--mut);font-size:14px;padding:8px 0}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:8px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.warn{border-color:var(--late)}
</style>
</head>
<body>
<main>
<div class="hd"><h1>出席管理</h1><span class="badge" id="bd"></span></div>
<div id="sb"></div>
<div class="tabs"><button id="t-in" data-tab="in">入力</button><button id="t-st" data-tab="st">集計</button><button id="t-cf" data-tab="cf">設定</button></div>
<div id="ms" class="note" style="margin:-6px 0 10px"></div>
<div id="app"></div>
</main>
<script>
var LK='circle-attendance-v1',LK2='circle-attendance-v2';
var COLS=['members','dates','grades','reasons','rec'];
var D={members:{},dates:{},grades:{},reasons:{},rec:{}};
var db=null,conn='loading',tab='in',cur=null,gran='month',R={from:'',to:''},note='',old=null,sh=(function(){try{return localStorage.getItem('att-sh')||'main';}catch(e){return 'main';}})(),TB={},addTab=false,unsubs=[],gotc={},lastSb='';

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]});}
function p2(n){return ('0'+n).slice(-2);}
function today(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function pd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function fmt(d){return (+d.split('-')[1])+'/'+(+d.split('-')[2])+'('+'日月火水木金土'[pd(d).getDay()]+')';}
function pct(n,t){return t?Math.round(n/t*1000)/10:0;}
function show(n,t){return t?pct(n,t).toFixed(1)+'%':'–';}
function uid(){return 'm'+Date.now().toString(36)+Math.floor(Math.random()*1e5).toString(36);}
function byT(c){return Object.keys(D[c]).sort(function(a,b){return (D[c][a].t||0)-(D[c][b].t||0)||(D[c][a].name>D[c][b].name?1:-1);});}
function ml(){var gi={};byT('grades').forEach(function(g,i){gi[g]=i;});
  return Object.keys(D.members).sort(function(a,b){var A=D.members[a],B=D.members[b],ga=gi[A.grade]!==undefined?gi[A.grade]:999,gb=gi[B.grade]!==undefined?gi[B.grade]:999;return ga-gb||(A.kana||A.name).localeCompare(B.kana||B.name,'ja');});}
function mst(o){return o.st||(o.xf?'leave':'active');}
function inLeave(d,m){var o=D.members[m];return !!(o&&mst(o)==='leave'&&(!o.xf||d>=o.xf)&&(!o.xt||d<=o.xt));}
function eff(d,m){var x=D.rec[d+'_'+m];if(x&&x.s)return x;return inLeave(d,m)?{s:'x'}:x;}
function streak(m,asOf){var n=0,ds=Object.keys(D.dates).sort();for(var i=ds.length-1;i>=0;i--){var d=ds[i];if(d>asOf)continue;var x=eff(d,m);if(!x||!x.s||x.s==='x')continue;if(x.s==='a')n++;else break;}return n;}
function lamp(n){var c=n>=5?'k':n>=3?'r':n>=2?'y':'g';return '<span class="lamp '+c+'" title="連続欠席 '+n+'回"></span>';}
function dl(){return Object.keys(D.dates).filter(function(d){return (!R.from||d>=R.from)&&(!R.to||d<=R.to);}).sort();}

/* ---- storage ---- */
function lload(){try{var r=localStorage.getItem(LK2);if(r){var o=JSON.parse(r);COLS.forEach(function(c){D[c]=o[c]||{};});}}catch(e){}}
function lsave(){try{localStorage.setItem(LK2,JSON.stringify(D));}catch(e){}}
function oldData(){try{var r=localStorage.getItem(LK);if(r){var o=JSON.parse(r);if(o&&o.members&&o.members.length)return o;}}catch(e){}return null;}
function msg(t){note=t;render();setTimeout(function(){if(note===t){note='';render();}},6000);}
function werr(){msg('保存できませんでした。閲覧のみの権限か、通信が不安定な可能性があります。');}
function cn(c,id){id=id||sh;return id==='main'?c:'x'+id+'_'+c;}
function put(c,id,o){if(db){db.doc(cn(c)+'/'+id).set(o).catch(werr);}else{D[c][id]=o;lsave();render();}}
function del(c,id){if(db){db.doc(cn(c)+'/'+id).delete().catch(werr);}else{delete D[c][id];lsave();render();}}
function tabList(){var ids=Object.keys(TB);if(ids.indexOf('main')<0)ids.push('main');return ids.sort(function(a,b){var A=a==='main'?((TB.main&&TB.main.t)||0):(TB[a].t||0),B=b==='main'?((TB.main&&TB.main.t)||0):(TB[b].t||0);return A-B;});}
function tname(id){return TB[id]&&TB[id].name?TB[id].name:(id==='main'?'メイン':'タブ');}
function subData(){
  unsubs.forEach(function(u){try{if(typeof u==='function')u();}catch(e){}});unsubs=[];gotc={};
  var my=sh;
  COLS.forEach(function(c){
    unsubs.push(db.collection(cn(c,my)).onSnapshot(function(s){
      if(my!==sh)return;
      var o={};s.docs.forEach(function(x){o[x.id]=x.data();});D[c]=o;gotc[c]=1;
      if(Object.keys(gotc).length===COLS.length)conn='ok';render();
    },function(){msg('共有データを読み込めません。');}));
  });
}
function switchTab(id){
  if(id===sh)return;
  sh=id;try{localStorage.setItem('att-sh',id);}catch(e){}
  cur=null;D={members:{},dates:{},grades:{},reasons:{},rec:{}};conn='loading';addTab=false;
  subData();render();
}
function tabCard(){return '<div class="card"><h2>このタブ</h2><div class="row"><input type="text" id="tnm" value="'+esc(tname(sh))+'" maxlength="20"><button class="btn pri" data-act="rntab">名前を変更</button>'+(sh==='main'?'':'<button class="btn del" data-act="deltab">このタブを削除</button>')+'</div><div class="note">タブごとに、メンバー・日にち・出欠・理由が別々に保存されます。上のタブ列の「＋」で新しいタブを作れます。'+(sh==='main'?'最初のタブ(メイン)は削除できません。':'')+'</div></div>';}

/* ---- stats ---- */
function stats(ids,dates){
  var r={p:0,a:0,l:0,e:0,t:0,x:0};
  ids.forEach(function(m){dates.forEach(function(d){
    var x=eff(d,m);if(!x||!x.s)return;
    if(x.s==='x'){r.x++;return;}
    r.t++;if(x.s==='p'){r.p++;if(x.l)r.l++;if(x.e)r.e++;}else r.a++;
  });});
  return r;
}
function statCard(lb,n,t,col){
  return '<div class="stat"><div class="lb">'+lb+'</div><div class="v" style="color:'+col+'">'+show(n,t)+'</div><div class="c">'+n+' / '+t+' 回</div><div class="bar"><i style="width:'+pct(n,t)+'%;background:'+col+'"></i></div></div>';
}
var HD='<th>出席率</th><th>欠席率</th><th>遅刻率</th><th>早退率</th><th>記録数</th>';
function rt(label,s,extra){
  return '<tr><td>'+label+'</td>'+(extra||'')+'<td style="color:var(--ok)">'+show(s.p,s.t)+'</td><td style="color:var(--ng)">'+show(s.a,s.t)+'</td><td style="color:var(--late)">'+show(s.l,s.t)+' <small>('+s.l+')</small></td><td style="color:var(--early)">'+show(s.e,s.t)+' <small>('+s.e+')</small></td><td>'+s.t+(s.x?' <small>(休団'+s.x+')</small>':'')+'</td></tr>';
}
function tbl(head,rows){return '<div class="scroll"><table><tr>'+head+'</tr>'+rows+'</table></div>';}
function wk(d){var dt=pd(d);dt.setDate(dt.getDate()-(dt.getDay()+6)%7);return dt.getFullYear()+'-'+p2(dt.getMonth()+1)+'-'+p2(dt.getDate());}
function gkey(d){return gran==='day'?d:gran==='week'?wk(d):d.slice(0,7);}
function glabel(k){return gran==='month'?k.replace('-','/').replace('/0','/'):(+k.split('-')[1])+'/'+(+k.split('-')[2])+(gran==='week'?'〜':'');}

function chart(rows){
  var W=640,H=230,L=40,RR=14,T=12,B=30,w=W-L-RR,h=H-T-B,n=rows.length;
  function x(i){return L+(n===1?w/2:w*i/(n-1));}
  function y(v){return T+h*(1-v/100);}
  var g='';
  [0,25,50,75,100].forEach(function(v){g+='<line x1="'+L+'" x2="'+(W-RR)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(y(v)+4)+'" text-anchor="end" font-size="11" fill="var(--mut)">'+v+'%</text>';});
  var step=Math.ceil(n/8);
  rows.forEach(function(r,i){if(i%step===0)g+='<text x="'+x(i)+'" y="'+(H-10)+'" text-anchor="middle" font-size="11" fill="var(--mut)">'+esc(r.label)+'</text>';});
  [['p','--ok'],['a','--ng'],['l','--late'],['e','--early']].forEach(function(s){
    var pts=rows.map(function(r,i){return x(i)+','+y(pct(r[s[0]],r.t));});
    if(n>1)g+='<polyline fill="none" stroke="var('+s[1]+')" stroke-width="2" points="'+pts.join(' ')+'"/>';
    rows.forEach(function(r,i){g+='<circle cx="'+x(i)+'" cy="'+y(pct(r[s[0]],r.t))+'" r="3" fill="var('+s[1]+')"/>';});
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="出席率の推移">'+g+'</svg>';
}

var PAL=['#3b6fe0','#1f9d63','#e08a1e','#d9475a','#8a5cd6','#14a5b8','#8b8f98'];
function chart2(labels,series){
  var W=640,H=230,L=40,RR=14,T=12,B=30,w=W-L-RR,h=H-T-B,n=labels.length;
  function x(i){return L+(n===1?w/2:w*i/(n-1));}
  function y(v){return T+h*(1-v/100);}
  var g='';
  [0,25,50,75,100].forEach(function(v){g+='<line x1="'+L+'" x2="'+(W-RR)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(y(v)+4)+'" text-anchor="end" font-size="11" fill="var(--mut)">'+v+'%</text>';});
  var step=Math.ceil(n/8);
  labels.forEach(function(l,i){if(i%step===0)g+='<text x="'+x(i)+'" y="'+(H-10)+'" text-anchor="middle" font-size="11" fill="var(--mut)">'+esc(l)+'</text>';});
  series.forEach(function(s){
    var pts=[];s.vals.forEach(function(v,i){if(v!==null)pts.push([x(i),y(v)]);});
    if(pts.length>1)g+='<polyline fill="none" stroke="'+s.color+'" stroke-width="2" points="'+pts.map(function(p){return p.join(',');}).join(' ')+'"/>';
    pts.forEach(function(p){g+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3" fill="'+s.color+'"/>';});
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="学年別の出席率の推移">'+g+'</svg>';
}
/* ---- views ---- */
function viewIn(){
  var ms=ml(),ds=Object.keys(D.dates).sort(),rs=byT('reasons'),lg=null,h='';
  h+='<div class="card"><h2>日にち</h2><div class="row"><input type="date" id="dt" value="'+today()+'"><button class="btn pri" data-act="addd">日にちを追加</button></div>';
  if(ds.length){
    h+='<div class="row" style="margin-top:10px"><select id="sel" data-ch="sel">'+ds.slice().reverse().map(function(d){return '<option value="'+d+'"'+(d===cur?' selected':'')+'>'+d+' '+fmt(d)+'</option>';}).join('')+'</select><button class="btn del" data-act="deld">この日を削除</button></div>';
  }
  h+='</div>';
  if(cur&&ms.length){
    h+='<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:6px"><h2 style="margin:0">'+fmt(cur)+' の出欠</h2><button class="btn" data-act="allp">全員出席にする</button></div>';
    ms.forEach(function(id){
      var m=D.members[id],x=eff(cur,id)||{},g=D.grades[m.grade];
      if(m.grade!==lg){lg=m.grade;h+='<div class="note" style="font-weight:600;margin:10px 0 0">'+(g?esc(g.name):'学年なし')+'</div>';}
      h+='<div class="mem"><span class="nm">'+lamp(streak(id,cur))+esc(m.name)+(g?' <small>'+esc(g.name)+'</small>':'')+'</span><div class="st" data-id="'+id+'">'
        +'<button class="p'+(x.s==='p'?' on':'')+'" data-b="p">出席</button>'
        +'<button class="a'+(x.s==='a'?' on':'')+'" data-b="a">欠席</button>'
        +'<button class="l'+(x.l?' on':'')+'" data-b="l">遅刻</button>'
        +'<button class="e'+(x.e?' on':'')+'" data-b="e">早退</button>'
        +'<button class="x'+(x.s==='x'?' on':'')+'" data-b="x">休団</button></div>';
      if(x.s==='a'||x.l||x.e){
        h+='<select data-ch="rsn" data-id="'+id+'"><option value="">理由を選択</option>'+rs.map(function(r){return '<option value="'+r+'"'+(x.r===r?' selected':'')+'>'+esc(D.reasons[r].name)+'</option>';}).join('')+'<option value="other"'+(x.r==='other'?' selected':'')+'>その他</option></select>';
        if(x.r==='other')h+='<input type="text" id="note_'+cur+'_'+id+'" data-ch="note" data-id="'+id+'" placeholder="その他の内容(任意)" maxlength="60" value="'+esc(x.n||'')+'">';
      }
      h+='</div>';
    });
    h+='<div class="note">遅刻・早退は出席した人に付けられます(押すと自動で出席になります)。休団は出席にも欠席にも数えません。名前の左のランプは連続欠席の目安です(緑=通常、黄=2回連続、赤=3〜4回連続、黒=5回以上連続)。欠席・遅刻・早退のときは理由も選べます(理由は「設定」で追加)。</div></div>';
  }else{
    h+='<div class="card empty">'+(ms.length?'日にちを追加すると出欠ボタンが表示されます。':'「設定」タブでメンバーを追加してください。')+'</div>';
  }
  return h;
}

function viewSt(){
  var ids=Object.keys(D.members),ds=dl(),all=stats(ids,ds),h='';
  h+='<div class="card"><h2>集計期間</h2><div class="row"><input type="date" data-ch="f1" value="'+R.from+'"><span>〜</span><input type="date" data-ch="f2" value="'+R.to+'"><button class="btn" data-act="clr">全期間</button></div></div>';
  if(!all.t)return h+'<div class="card empty">この期間に入力された出欠がありません。</div>';
  h+='<div class="card"><h2>全体('+ds.length+'日 × '+ids.length+'人)</h2><div class="grid">'
    +statCard('出席率',all.p,all.t,'var(--ok)')+statCard('欠席率',all.a,all.t,'var(--ng)')
    +statCard('遅刻率',all.l,all.t,'var(--late)')+statCard('早退率',all.e,all.t,'var(--early)')+'</div>'
    +'<div class="note">各率 = 該当回数 ÷ 入力済みの回数(出席+欠席)。遅刻・早退は出席の内数です。休団は出席・欠席のどちらにも数えません。</div></div>';

  /* trend */
  var gs={};ds.forEach(function(d){var k=gkey(d);(gs[k]=gs[k]||[]).push(d);});
  var trows=Object.keys(gs).sort().map(function(k){var s=stats(ids,gs[k]);s.label=glabel(k);return s;}).filter(function(s){return s.t;});

  if(!gid)gid=ls('fb-gid');
  if(!cfg){conn='setup';render();return;}
  if(!gid){gid=uid()+uid();ls('fb-gid',gid);}
  CFG=cfg;GID=gid;
  for(var i=0;i<100&&!window.__fb;i++)await new Promise(function(r){setTimeout(r,100);});
  if(!window.__fb){conn='slow';render();return;}
  try{db=window.__fb(cfg,gid);}catch(e){conn='slow';msg('Firebaseの設定を読み込めませんでした。');return;}
  D={members:{},dates:{},grades:{},reasons:{},rec:{}};render();
  db.collection('tabs').onSnapshot(function(s){var o={};s.docs.forEach(function(x){o[x.id]=x.data();});TB=o;if(sh!=='main'&&!TB[sh])switchTab('main');else render();},function(){});
  subData();
  setTimeout(function(){if(conn==='loading'){conn='slow';render();}},10000);
})();
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,doc,setDoc,deleteDoc,collection,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
window.__fb=function(cfg,gid){
  var fs=getFirestore(initializeApp(cfg));
  function seg(p){return [fs,'groups',gid].concat(p.split('/'));}
  return {
    doc:function(p){var r=doc.apply(null,seg(p));return {set:function(o){return setDoc(r,o);},delete:function(){return deleteDoc(r);}};},
    collection:function(p){var r=collection.apply(null,seg(p));return {onSnapshot:function(ok,err){return onSnapshot(r,function(q){ok({docs:q.docs.map(function(d){return {id:d.id,data:function(){return d.data();}};})});},err);}};}
  };
};
</script>
